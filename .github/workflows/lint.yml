# This GitHub Actions workflow performs linting and formatting checks on the codebase.
# 
# Name: Lint Check
# 
# Triggers:
#   - Can be invoked by other workflows using `workflow_call`.
#
# Jobs:
#   lint:
#     - Runs on: ubuntu-latest
#     - Steps:
#         1. Checks out the repository code.
#         2. Sets up Node.js version 18 with npm caching.
#         3. Installs dependencies using `npm ci`.
#         4. Runs Prettier to check code formatting.
#         5. Runs the project's lint script.
#         6. Runs TypeScript compiler in noEmit mode to check for type errors.
name: Lint Check

on:
  workflow_call: {}

jobs:
  lint:
    name: Lint & Formatting Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - run: npm ci

      - name: Run Prettier Check
        run: npx prettier --check .
        continue-on-error: true

      - name: Run Lint
        run: npm run lint
        continue-on-error: true

      - name: TypeScript Check (no emit)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Fail if any step failed
        run: |
          echo "Prettier outcome: ${{ steps.prettier.outcome }}"
          echo "Lint outcome:     ${{ steps.lint.outcome }}"
          echo "TS Check outcome: ${{ steps.tsc.outcome }}"

          if [ "${{ steps.prettier.outcome }}" == "failure" ] || \
             [ "${{ steps.lint.outcome }}" == "failure" ] || \
             [ "${{ steps.tsc.outcome }}" == "failure" ]; then
            echo "❌ One or more checks failed"
            exit 1
          else
            echo "✅ All checks passed"
          fi
